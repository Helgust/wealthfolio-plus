[project]
name = "spain-planner"
version = "0.1.0"
description = "Личный финансовый планировщик с учётом испанских налогов"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.20",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
spain-planner = "planner.app.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.5",
    "ipykernel>=6.29",
    "nbformat>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear, simplify, pytest, numpy, ruff-specific
select = ["F", "E", "W", "I", "UP", "B", "SIM", "PT", "NPY", "RUF"]
# кириллица в строках и комментариях — норма для проекта
ignore = ["RUF001", "RUF002", "RUF003"]
