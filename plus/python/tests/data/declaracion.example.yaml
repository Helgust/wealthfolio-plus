# Reference: your IRPF tax return from Renta Web. Copy to tests/data/declaracion_<year>.yaml
# (the file is in .gitignore) and fill it in. tests/test_declaracion.py checks the model against
# the return; without the file it is skipped. Amounts in euros per year, as in the return.
year: 2025

# --- Inputs -----------------------------------------------------------------
contribuyente: {edad: 35, discapacidad: ninguna}   # ninguna | grado_33 | grado_65; age on 31.12
descendientes: []            # e.g.: [{edad: 5, share: 0.5}] — share 0.5 if the mínimo is split
ascendientes: []             # e.g.: [{edad: 72}]

actividad:
  ingresos: 0                # ingresos de explotación (excluding IVA)
  gastos: 0                  # gastos deducibles WITHOUT the RETA cuota
  cuota_reta: 0              # RETA cuota actually paid for the year
  dependiente: false         # reducción art. 32.2.1º was applied
  inicio_actividad: false    # the 20 % reducción art. 32.3 was applied

rendimientos_trabajo: 0      # rendimiento neto del trabajo
rcm: 0                       # saldo rendimientos del capital mobiliario (savings base)
ganancias: 0                 # saldo ganancias y pérdidas patrimoniales (savings base)
aportacion_pensiones: 0      # contributions to regular pension plans
aportacion_pensiones_autonomo: 0  # to planes de empleo simplificados for autónomos
deducciones: {estatal: 0, autonomica: 0}  # deducciones summed by half

# --- Reference values from the return ---------------------------------------
# Fill in what you have; empty (null) fields are not checked.
esperado:
  rendimiento_neto_actividad: null
  base_liquidable_general: null
  base_liquidable_ahorro: null
  cuota_integra_estatal: null
  cuota_integra_autonomica: null
  cuota_liquida_estatal: null
  cuota_liquida_autonomica: null
