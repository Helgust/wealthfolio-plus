# Rendimiento neto de actividades económicas — estimación directa simplificada.
# Provisiones deducibles + gastos de difícil justificación: a percentage of rendimiento neto
# (without this concepto itself), capped at a yearly limit.
# Source: art. 30.2.2.ª RIRPF (RD 439/2007; consolidated BOE text as of 28.02.2026);
# the 2,000 € limit — art. 28.1.4.ª LIRPF (consolidated text as of 09.09.2026).
# The law has no general increase to 7 % for 2026 (only 10 % for Ceuta, DA 64.ª LIRPF).
# TODO: verify at year end — a law may change it before 31.12.2026.
estimacion_directa_simplificada:
  gastos_dificil_justificacion:
    rate: 0.05
    limit: 2000
