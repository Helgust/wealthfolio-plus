# Rendimiento neto de actividades económicas — estimación directa simplificada.
# Provisiones deducibles + gastos de difícil justificación: процент от rendimiento neto
# (без самого этого concepto), не больше лимита в год.
# Источник: art. 30.2.2.ª RIRPF (RD 439/2007; консолидированный текст BOE на 28.02.2026);
# лимит 2 000 € — art. 28.1.4.ª LIRPF (консолидированный текст на 09.09.2026).
# Общего повышения до 7 % на 2026 в законе нет (есть только 10 % для Ceuta, DA 64.ª LIRPF).
# TODO: verify в конце года — может измениться законом до 31.12.2026.
estimacion_directa_simplificada:
  gastos_dificil_justificacion:
    rate: 0.05
    limit: 2000
