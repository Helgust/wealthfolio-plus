# Cotizaciones a la Seguridad Social of an employee, Régimen General — the worker's share only.
# They are gastos deducibles of the rendimientos del trabajo (art. 19.2.a LIRPF).
# Source — Orden PJC/297/2026, de 30 de marzo (BOE-A-2026-7296), checked on 27.09.2026 against the
# BOE text. The base de cotización is the monthly pay with the pagas extra prorated, so for a year it
# is the salario bruto anual, capped at 12 × tope_maximo. Not modelled: the bases mínimas by grupo de
# cotización (a salary is assumed above them) and pluriempleo.

tope_maximo: 5101.20              # art. 2.1: euros per month

tipos:                            # worker's share of the base
  contingencias_comunes: 0.047    # art. 4.a: 28,30 %, of which 4,70 % the worker
  mei: 0.0015                     # art. 16: 0,90 %, of which 0,15 % the worker
  desempleo: 0.0155               # art. 33.2.a.1º: contratación indefinida 7,05 %, 1,55 % the worker
                                  # (duración determinada: 1,60 % — not modelled)
  formacion_profesional: 0.001    # art. 33.2.c: 0,70 %, of which 0,10 % the worker

# Cotización adicional de solidaridad (art. 19 bis LGSS; art. 17.1 of the Orden) on the monthly pay
# above the tope: up to 10 % above it, from 10 % to 50 %, and beyond 50 %. hasta — upper bound as a
# multiple of tope_maximo (5 611,32 € and 7 651,80 € in the Orden); null — unbounded.
solidaridad:
  - {hasta: 1.1, tipo: 0.0019}    # 17.1.a: 1,15 %, of which 0,19 % the worker
  - {hasta: 1.5, tipo: 0.0021}    # 17.1.b: 1,25 %, of which 0,21 % the worker
  - {hasta: null, tipo: 0.0024}   # 17.1.c: 1,46 %, of which 0,24 % the worker
