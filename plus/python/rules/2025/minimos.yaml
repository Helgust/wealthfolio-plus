# Mínimo personal y familiar (arts. 56–61 LIRPF). Суммы в евро в год.
# Каждая половина IRPF (estatal / autonómica) считает mínimo по своим суммам (art. 56.3 LIRPF);
# автономия вправе менять суммы не более чем на ±10 % (Ley 22/2009, art. 46).

estatal:
  # Сверено: AEAT, Manual práctico IRPF 2025, «Cuadro resumen del mínimo personal y familiar».
  contribuyente:
    general: 5550          # art. 57.1
    mayor_65: 1150         # art. 57.2 — прибавка
    mayor_75: 1400         # art. 57.2 — дополнительная прибавка сверх mayor_65
  descendientes:           # art. 58.1 — по порядку детей
    por_orden: [2400, 2700, 4000, 4500]   # 1-й, 2-й, 3-й, 4-й и следующие
    menor_3: 2800          # art. 58.2 — прибавка на ребёнка младше 3 лет
  ascendientes:            # art. 59
    general: 1150
    mayor_75: 1400
  discapacidad:            # art. 60 — одинаково для contribuyente / descendiente / ascendiente
    grado_33: 3000         # 33 % ≤ grado < 65 %
    grado_65: 9000         # grado ≥ 65 %
    asistencia: 3000       # прибавка: нужна помощь третьих лиц / ограниченная мобильность или ≥65 %

autonomica:
  # Comunitat Valenciana: art. 2 bis Ley 13/1997 (GVA).
  # Сверено: AEAT, Manual práctico IRPF 2025, «Comunitat Valenciana: importes del mínimo personal y familiar».
  # Действует в 2025.
  contribuyente:
    general: 6105
    mayor_65: 1265
    mayor_75: 1540
  descendientes:
    por_orden: [2640, 2970, 4400, 4950]
    menor_3: 3080
  ascendientes:
    general: 1265
    mayor_75: 1540
  discapacidad:
    grado_33: 3300
    grado_65: 9900
    asistencia: 3300

# Условия применения — общие для обеих половин (государственные нормы).
condiciones:
  edad_mayor_65: 65          # arts. 57.2, 59.1: возраст на дату devengo (31.12, art. 61)
  edad_mayor_75: 75          # TODO: verify — граница включительно (AEAT: «65 años o más» на 31.12)
  descendiente_edad_max: 25  # art. 58.1: младше 25 лет (или с discapacidad — любой возраст)
  descendiente_menor: 3      # art. 58.2
  renta_max_familiar: 8000   # arts. 58.1, 59.1: годовые доходы иждивенца без exentas, не выше
