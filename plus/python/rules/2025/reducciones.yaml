# IRPF reducciones and compensación de rentas. Source — LIRPF (Ley 35/2006), consolidated
# text BOE-A-2006-20764 as of 09.09.2026; the articles below have not changed since 2023 (Ley 31/2022),
# so they are the same for 2025 and 2026. Order of application checked with AEAT, Manual práctico Renta 2025.

# Reducción on rendimientos netos de actividades económicas (art. 32.2 and 32.3 LIRPF).
actividad:
  # 32.2.1º — only when all 32.2.2º requirements hold: a single client (or TRADE), gastos ≤ 30 %
  # of ingresos, no rendimientos del trabajo, ≥ 70 % of ingresos with retención, estimación directa;
  # in EDS incompatible with gastos de difícil justificación.
  dependiente:
    general: 2000
    adicional:                  # 32.2.1º.a — if rendimiento < rend_max and other rentas ≤ otras_rentas_max
      rend_max: 19747.5
      otras_rentas_max: 6500
      plano_hasta: 14047.5      # up to this rendimiento — the full amount
      importe: 6498
      pendiente: 1.14           # beyond: importe − pendiente × (rend − plano_hasta)
    discapacidad_33: 3500       # 32.2.1º.b
    discapacidad_65: 7750       # 32.2.1º.b — ≥ 65 % or third-party help / movilidad reducida
  # 32.2.3º — other autónomos with rentas no exentas (including the activity itself) < rentas_max.
  rentas_bajas:
    rentas_max: 12000
    plano_hasta: 8000
    importe: 1620
    pendiente: 0.405
  # 32.3 — start of activity: 20 % of the positive rendimiento (after 32.1–32.2) in the first
  # year with a positive rendimiento and the next one; the base is capped at base_max.
  inicio_actividad:
    rate: 0.20
    base_max: 100000

# Aportaciones a sistemas de previsión social (arts. 51.6 and 52.1 LIRPF).
prevision_social:
  limite_general: 1500          # art. 52.1.b / 51.6.a — pension plans of all kinds together
  incremento_autonomo: 4250     # art. 52.1.b.2º — only from planes de empleo simplificados /
                                # sectoriales for autónomos etc.; not multiplied per instrument
  porcentaje_rendimientos: 0.30 # art. 52.1.a — 30 % of rendimientos netos trabajo + actividades
  # TODO: verify — the 30 % applies to the general limit together with the incremento (as art. 52.1 reads).
  # Not modelled: the 8,500 € incremento for contribuciones empresariales (an autónomo has none)
  # and the 5-year carry-forward of amounts unused due to the 30 % cap or a short base (art. 52.2).

# Compensación de rentas negativas (arts. 48, 49, 50.3 LIRPF).
compensacion:
  limite_cruzado: 0.25   # share of the other basket's positive saldo (rcm ↔ ganancias), shared
                         # by current and prior-year losses (Manual práctico 2025, cap. 12)
  anos: 4                # carried forward 4 years, in the largest possible amount

# Rendimientos del trabajo without Seguridad Social contributions — pension plan payouts, SS pensions
# (arts. 19.2.f and 20 LIRPF). Source — consolidated text BOE-A-2006-20764 as of 25.09.2026:
# 19.2.f — Ley 26/2014, since 2015; art. 20 — Real Decreto-ley 4/2024 (BOE-A-2024-12944), since 2024.
# Order and definitions checked with AEAT, Manual práctico Renta 2025, cap. 3, fases 2–3.
trabajo:
  otros_gastos: 2000            # 19.2.f — at most the rendimiento íntegro minus gastos 19.2.a–e.
                                # Relocation and discapacidad increases — trabajadores activos only.
  # Art. 20: if rendimiento neto del trabajo (íntegro − gastos 19.2.a–e, without 19.2.f) < rend_max
  # and other rentas no exentas ≤ otras_rentas_max. Other rentas — algebraic sum of net
  # rendimientos (capital, actividades — without reducciones), imputaciones and ganancias/pérdidas.
  # The result after the reducción cannot be negative.
  reduccion:
    rend_max: 19747.5
    otras_rentas_max: 6500
    plano_hasta: 14852          # 20.a — up to this rendimiento, the full amount
    importe: 7302
    pendiente: 1.75             # 20.b — importe − pendiente × (rend − plano_hasta)
    quiebra: 17673.52           # 20.c — from this rendimiento
    importe_quiebra: 2364.34    #        importe_quiebra − pendiente_quiebra × (rend − quiebra)
    pendiente_quiebra: 1.14

# Tributación conjunta (art. 84 LIRPF), unidad familiar art. 82.1.1.ª: cónyuges no separados
# (+ hijos menores). 84.2.3º: reducción de la base imponible before reducciones arts. 51, 53, 54 and
# DA 11.ª — general base first (not below 0), the rest from the savings base (not below 0).
# Checked: LIRPF, consolidated BOE text as of 09.09.2026 (84.2.3º unchanged since 2007).
# Monoparental (84.2.4º, 2,150 €) is not modelled: the household is a couple.
tributacion_conjunta:
  reduccion_biparental: 3400
