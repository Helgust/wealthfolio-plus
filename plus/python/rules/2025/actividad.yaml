# Rendimiento neto de actividades económicas — estimación directa simplificada.
# Provisiones deducibles + gastos de difícil justificación: процент от rendimiento neto
# (без самого этого concepto), не больше лимита в год.
# Источник: art. 30.2.2.ª RIRPF (RD 439/2007); лимит 2 000 € — art. 28.1.4.ª LIRPF.
# Сверено: AEAT, Manual práctico IRPF 2025, «Principales novedades — rendimiento de actividades
# económicas» (5 % в 2025). В 2023 было 7 % (DA 56.ª LIRPF) — только за тот год.
estimacion_directa_simplificada:
  gastos_dificil_justificacion:
    rate: 0.05
    limit: 2000
